[package]
name = "smtc-widget"
version = "0.1.0"
description = "A Tauri App"
authors = ["NockIA"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "smtc_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
thiserror = "2"
webview2-com = "0.39"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-log = "2"
log = "0.4"
# Requis par la macro `#[implement]` du crate `windows` (objets COM de notification du volume).
windows-core = "0.62"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Foundation",
    "Storage_Streams",
    "Graphics_Imaging",
    "UI_ViewManagement",
]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
# Optimisé pour la taille : l'app attend surtout des événements, la vitesse brute compte peu.
opt-level = "s"
panic = "abort"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Appels Win32 : conversions d'entiers et pointeurs bruts inévitables.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
borrow_as_ptr = "allow"
ptr_as_ptr = "allow"
# Signatures imposées par Tauri (`State`, `WebviewWindow` pris par valeur).
needless_pass_by_value = "allow"
